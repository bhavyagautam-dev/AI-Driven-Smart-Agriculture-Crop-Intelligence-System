<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body{
background:#0f172a;
color:white;
text-align:center;
font-family:Arial;
}
.box{
width:300px;
margin:auto;
margin-top:100px;
background:#92a9cd;
padding:20px;
border-radius:10px;
}
input{
width:90%;
padding:8px;
margin:10px;
border:none;
border-radius:5px;
}
button{
background:#22c55e;
color:white;
padding:10px;
border:none;
border-radius:5px;
cursor:pointer;
}
button:hover{
background:#16a34a;
}
</style>
</head>

<body>

<div class="box">
<h2>🔐 Login</h2>

<form method="post">
<input name="username" placeholder="Username"><br>
<input type="password" name="password" placeholder="Password"><br>
<button type="submit">Login</button>
</form>
<br>
<a href="/register">Create Account</a><br><br>
<a href="/forgot">Forgot Password</a>
</div>

</body>
</html>
