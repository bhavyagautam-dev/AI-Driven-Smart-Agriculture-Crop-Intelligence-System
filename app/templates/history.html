<h2>Your History</h2>

<table border="1">
<tr>
    <th>N</th>
    <th>P</th>
    <th>K</th>
    <th>Temp</th>
    <th>Humidity</th>
    <th>pH</th>
    <th>Rainfall</th>
    <th>Prediction</th>
</tr>

{% for row in data %}
<tr>
    <td>{{ row[2] }}</td>
    <td>{{ row[3] }}</td>
    <td>{{ row[4] }}</td>
    <td>{{ row[5] }}</td>
    <td>{{ row[6] }}</td>
    <td>{{ row[7] }}</td>
    <td>{{ row[8] }}</td>
    <td>{{ row[9] }}</td>
</tr>
{% endfor %}
</table>
