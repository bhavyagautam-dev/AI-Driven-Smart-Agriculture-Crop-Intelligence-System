<!DOCTYPE html>
<html>
<head>
<title>AI Smart Agriculture</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial;
}

.navbar{
    display:flex;
    justify-content:space-between;
    padding:15px;
    background:#1e293b;
}

.navbar a{
    color:white;
    margin-left:15px;
    text-decoration:none;
}

.container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    padding:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:10px;
    width:300px;
}

button{
    padding:10px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.on{background:green;color:white;}
.off{background:red;color:white;}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <h2>🌱 Smart Agriculture</h2>
    <div>
        👤 {{ user }}
        <a href="/history">History</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">

<!-- SENSOR DATA -->
<div class="card">
<h3>📊 Sensor Data</h3>
<p>🌡 Temp: <span id="temp">0</span></p>
<p>💧 Humidity: <span id="humidity">0</span></p>
<p>🌱 Soil: <span id="soil">0</span></p>
</div>

<!-- MOTOR CONTROL -->
<div class="card">
<h3>⚡ Motor Control</h3>
<button class="on" onclick="onMotor()">ON</button>
<button class="off" onclick="offMotor()">OFF</button>
<p>Status: <span id="motor">OFF</span></p>
</div>

<!-- GRAPH -->
<div class="card">
<h3>📈 Live Graph</h3>
<canvas id="chart"></canvas>
</div>

</div>

<script>

let chart;

function loadData(){
fetch('/sensor-data')
.then(res=>res.json())
.then(data=>{

document.getElementById("temp").innerText=data.temp;
document.getElementById("humidity").innerText=data.humidity;
document.getElementById("soil").innerText=data.soil;
document.getElementById("motor").innerText=data.motor;

updateChart(data);

});
}

function onMotor(){
fetch('/motor/on')
.then(()=>{document.getElementById("motor").innerText="ON";});
}

function offMotor(){
fetch('/motor/off')
.then(()=>{document.getElementById("motor").innerText="OFF";});
}

function updateChart(data){

const values=[data.temp,data.humidity,data.soil];

if(chart){
chart.data.datasets[0].data=values;
chart.update();
}else{
chart=new Chart(document.getElementById("chart"),{
type:"bar",
data:{
labels:["Temp","Humidity","Soil"],
datasets:[{label:"Sensor Data",data:values}]
}
});
}

}

setInterval(loadData,2000);
loadData();

</script>

</body>
</html>
