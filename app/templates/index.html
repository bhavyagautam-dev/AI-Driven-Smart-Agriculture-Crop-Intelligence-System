<!DOCTYPE html>
<html>
<head>
<title>AI Smart Agriculture</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <h2>🌱 Smart Agriculture</h2>
    <div>
        👤 {{ user }}
        <a href="/history">History</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<!-- Main -->
<div class="container">

    <!-- Sensor Card -->
    <div class="card">
        <h3>📊 Sensor Data</h3>
        <p>Temp: <span id="temp"></span> °C</p>
        <p>Humidity: <span id="hum"></span> %</p>
        <p>Soil: <span id="soil"></span> %</p>
    </div>

    <!-- Form Card -->
    <div class="card">
        <h3>🌾 Crop Prediction</h3>

        <form action="/predict" method="post">
            <input name="nitrogen" placeholder="Nitrogen">
            <input name="phosphorus" placeholder="Phosphorus">
            <input name="potassium" placeholder="Potassium">

            <input name="temperature" placeholder="Temperature">
            <input name="humidity" placeholder="Humidity">
            <input name="ph" placeholder="pH">
            <input name="rainfall" placeholder="Rainfall">

            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
        <div class="result">
            🌾 {{ prediction }}
        </div>
        {% endif %}
    </div>

    <!-- Graph Card -->
    <div class="card">
        <h3>📈 Live Graph</h3>
        <canvas id="chart"></canvas>
    </div>

</div>

<!-- JS -->
<script>
let chart;

function updateUI(data){
    document.getElementById("temp").innerText = data.temperature;
    document.getElementById("hum").innerText = data.humidity;
    document.getElementById("soil").innerText = data.soil_moisture;
}

function updateChart(data){
    const chartData = {
        labels:["Temp","Humidity","Soil"],
        datasets:[{
            label:"Sensor",
            data:[data.temperature, data.humidity, data.soil_moisture]
        }]
    };

    if(chart){
        chart.data = chartData;
        chart.update();
    }else{
        chart = new Chart(document.getElementById("chart"),{
            type:"bar",
            data:chartData
        });
    }
}

function loadData(){
    fetch('/sensor-data')
    .then(res=>res.json())
    .then(data=>{
        updateUI(data);
        updateChart(data);
    });
}

setInterval(loadData,2000);
</script>

</body>
</html>
